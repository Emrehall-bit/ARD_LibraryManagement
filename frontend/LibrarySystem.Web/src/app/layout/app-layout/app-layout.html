<div class="app-shell">
  <app-topbar (menuClick)="openSidebar()" />

  <div class="app-shell__body">
    <aside class="app-shell__sidebar" aria-label="Ana navigasyon">
      <app-sidebar />
    </aside>

    <main class="app-shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <button
    type="button"
    class="app-shell__mobile-backdrop"
    [class.app-shell__mobile-backdrop--visible]="sidebarVisible"
    aria-label="Menüyü kapat"
    (click)="closeSidebar()"
  ></button>

  <aside
    class="app-shell__mobile-sidebar"
    [class.app-shell__mobile-sidebar--visible]="sidebarVisible"
    aria-label="Mobil navigasyon"
    (click)="closeSidebar()"
  >
    <app-sidebar />
  </aside>
</div>
