<header class="topbar flex align-items-center justify-content-between">
  <div class="topbar__brand flex align-items-center gap-2">
    <button
      type="button"
      class="topbar__menu"
      aria-label="Menüyü aç"
      (click)="menuClick.emit()"
    >
      <i class="pi pi-bars"></i>
    </button>

    <span class="topbar__brand-icon flex align-items-center justify-content-center">
      <img src="/logo.jpg" alt="Kütüphanem logosu" />
    </span>
    <span class="topbar__brand-text">Kütüphanem</span>
  </div>

  <div class="topbar__actions flex align-items-center gap-1">
    <button type="button" class="topbar__icon-button" aria-label="Bildirimler">
      <i class="pi pi-bell"></i>
    </button>
    <button type="button" class="topbar__icon-button" aria-label="Ayarlar">
      <i class="pi pi-cog"></i>
    </button>

    @if (isAuthenticated()) {
      <div class="topbar__user flex align-items-center gap-2">
        <span class="topbar__avatar flex align-items-center justify-content-center">{{ avatarInitial() }}</span>
        <span class="topbar__user-meta">
          <span class="topbar__username">{{ username() }}</span>
          @if (roleLabel(); as label) {
            <span class="topbar__role">{{ label }}</span>
          }
        </span>
        <i class="pi pi-angle-down topbar__chevron"></i>
      </div>

      <button type="button" class="topbar__auth-button" aria-label="Çıkış yap" (click)="logout()">
        <i class="pi pi-sign-out"></i>
        <span>Çıkış Yap</span>
      </button>
    } @else {
      <button type="button" class="topbar__auth-button" aria-label="Giriş yap" (click)="login()">
        <i class="pi pi-sign-in"></i>
        <span>Giriş Yap</span>
      </button>
    }
  </div>
</header>
