<header class="topbar flex align-items-center justify-content-between">
  <div class="topbar__brand flex align-items-center gap-2">
    <p-button
      class="topbar__menu"
      icon="pi pi-bars"
      severity="secondary"
      [rounded]="true"
      [text]="true"
      ariaLabel="Menüyü aç"
      (onClick)="menuClick.emit()"
    />

    <span class="topbar__brand-icon flex align-items-center justify-content-center">
      <i class="pi pi-book"></i>
    </span>
    <span class="topbar__brand-text">Kütüphanem</span>
  </div>

  <div class="topbar__actions flex align-items-center gap-1">
    <p-button
      icon="pi pi-bell"
      severity="secondary"
      [rounded]="true"
      [text]="true"
      ariaLabel="Bildirimler"
    />
    <p-button
      icon="pi pi-cog"
      severity="secondary"
      [rounded]="true"
      [text]="true"
      ariaLabel="Ayarlar"
    />

    @if (isAuthenticated()) {
      <div class="topbar__user flex align-items-center gap-2">
        <span class="topbar__avatar flex align-items-center justify-content-center">{{ avatarInitial() }}</span>
        <span class="topbar__user-meta">
          <span class="topbar__username">{{ username() }}</span>
          @if (roleLabel(); as label) {
            <p-tag styleClass="topbar__role" [value]="label" severity="secondary" />
          }
        </span>
        <i class="pi pi-angle-down topbar__chevron"></i>
      </div>

      <p-button
        icon="pi pi-sign-out"
        label="Çıkış Yap"
        severity="secondary"
        [text]="true"
        styleClass="topbar__auth-button"
        ariaLabel="Çıkış yap"
        (onClick)="logout()"
      />
    } @else {
      <p-button
        icon="pi pi-sign-in"
        label="Giriş Yap"
        severity="secondary"
        [text]="true"
        styleClass="topbar__auth-button"
        ariaLabel="Giriş yap"
        (onClick)="login()"
      />
    }
  </div>
</header>
